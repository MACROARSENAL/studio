name: Podcast — casting

# Casting d'une voix de podcast (Qwen3-TTS VoiceDesign, voix/casting.py), contrôle par transcription (voix/qa.py),
# puis rangement sur la branche « podcast-resultats » (dossier casting/).
# Lancement : modifier podcast/casting-run.json sur la branche podcast-presentation et pousser.
on:
  push:
    branches: [podcast-presentation]
    paths: ['podcast/casting-run.json']

permissions:
  contents: write

concurrency:
  group: podcast-casting
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      dossier: ${{ steps.m.outputs.dossier }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          R = json.load(open('podcast/casting-run.json'))
          print('matrix=' + json.dumps({'include': R['jobs']}))
          print('dossier=' + R.get('dossier', 'casting'))
          EOF

  voix:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: qwen-tts-voicedesign-v1
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg sox > /dev/null
          set -o pipefail
          { pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio && pip install -U qwen-tts soundfile; } > /tmp/pip.log 2>&1 || { tail -40 /tmp/pip.log | tr '\n' ' ' | sed 's/^/::error title=pip::/'; echo; exit 1; }
          python -m venv /tmp/asr && /tmp/asr/bin/pip install -q faster-whisper scipy > /tmp/pip2.log 2>&1 || { tail -20 /tmp/pip2.log | tr '\n' ' ' | sed 's/^/::error title=pip asr::/'; echo; exit 1; }
      - name: Voix
        env:
          LANGUE: ${{ matrix.langue }}
          TEXTE: ${{ matrix.texte }}
        run: |
          set -o pipefail
          python voix/casting.py ${{ matrix.voix }} ${{ matrix.prise }} /tmp/out ${{ matrix.actes }} 2>&1 | tee /tmp/run.log || { grep -v '^ok' /tmp/run.log | grep -v -i -E 'warning|pci_bus|sox|flash-attn' | tail -15 | tr '\n' ' ' | sed 's/^/::error title=Voix::/'; echo; exit 1; }
      - name: Contrôle par transcription
        env:
          LANGUE: ${{ matrix.langue }}
        run: |
          set -o pipefail
          /tmp/asr/bin/python voix/qa.py /tmp/out/${{ matrix.voix }}-${{ matrix.prise }} 2>&1 | tee /tmp/qa.log || { grep -v '^ok' /tmp/qa.log | grep -v -i warning | tail -12 | tr '\n' ' ' | sed 's/^/::warning title=Contrôle::/'; echo; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voix-${{ matrix.voix }}-${{ matrix.prise }}
          path: /tmp/out
          retention-days: 7

  ranger:
    needs: [plan, voix]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/all
          merge-multiple: true
      - name: Ranger sur la branche « podcast-resultats »
        env:
          D: ${{ needs.plan.outputs.dossier }}
        run: |
          git config --global user.name "studio-bot"; git config --global user.email "studio-bot@users.noreply.github.com"
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            rm -rf /tmp/br
            if git clone -q --depth 1 -b podcast-resultats "$URL" /tmp/br 2>/dev/null; then cd /tmp/br; else mkdir /tmp/br && cd /tmp/br && git init -q -b podcast-resultats; fi
            mkdir -p "$D" && cp -r /tmp/all/* "$D"/
            git add -A && git commit -qm "Casting podcast : $D (${GITHUB_SHA::7})" || exit 0
            git push -q "$URL" HEAD:podcast-resultats && break
            cd /; sleep $((i * 7))
          done
          ls -la /tmp/br/"$D"
