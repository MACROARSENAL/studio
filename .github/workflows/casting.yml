name: Casting des voix

# Trois voix de conteur × deux prises, en parallèle, puis tout est rangé sur la branche « casting » (écoute + contrôles).
# Lancement : git push -f origin HEAD:casting-run (ou onglet Actions → Run workflow).
on:
  push:
    branches: [casting-run]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      branche: ${{ steps.m.outputs.branche }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          R = json.load(open('voix/casting-run.json')) if os.path.exists('voix/casting-run.json') else {}
          jobs = R.get('jobs') or [{'langue': 'fr', 'voix': v, 'prise': p} for v in ['conteur', 'conteur-lumineux', 'conteuse'] for p in [1, 2]]
          print('matrix=' + json.dumps({'include': jobs}))
          print('branche=' + R.get('branche', 'casting'))
          EOF

  voix:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg sox > /dev/null
          set -o pipefail
          { pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio && pip install -U qwen-tts soundfile; } > /tmp/pip.log 2>&1 || { tail -40 /tmp/pip.log | tr '\n' ' ' | sed 's/^/::error title=pip::/'; echo; exit 1; }
          # Transcription dans un environnement séparé (évite les conflits de bibliothèques avec la synthèse vocale)
          python -m venv /tmp/asr && /tmp/asr/bin/pip install -q faster-whisper scipy > /tmp/pip2.log 2>&1 || { tail -20 /tmp/pip2.log | tr '\n' ' ' | sed 's/^/::error title=pip asr::/'; echo; exit 1; }
          nproc; free -g
      - name: Voix
        env:
          LANGUE: ${{ matrix.langue }}
          TEXTE: ${{ matrix.texte }}
        run: |
          set -o pipefail
          python voix/casting.py ${{ matrix.voix }} ${{ matrix.prise }} /tmp/out ${{ matrix.actes || 'conte' }} 2>&1 | tee /tmp/run.log || { grep -v '^ok' /tmp/run.log | grep -v -i -E 'warning|pci_bus|sox|flash-attn' | tail -15 | tr '\n' ' ' | sed 's/^/::error title=Voix::/'; echo; exit 1; }
      - name: Contrôle par transcription
        env:
          LANGUE: ${{ matrix.langue }}
        run: |
          set -o pipefail
          /tmp/asr/bin/python voix/qa.py /tmp/out/${{ matrix.voix }}-${{ matrix.prise }} 2>&1 | tee /tmp/qa.log || { grep -v '^ok' /tmp/qa.log | grep -v -i warning | tail -12 | tr '\n' ' ' | sed 's/^/::warning title=Contrôle::/'; echo; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voix-${{ matrix.voix }}-${{ matrix.prise }}
          path: /tmp/out

  ranger:
    needs: [plan, voix]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/all
          merge-multiple: true
      - name: Ranger sur la branche « casting »
        run: |
          cd /tmp/all && ls -la
          git init -q -b ${{ needs.plan.outputs.branche }}
          git config user.name "studio-bot"; git config user.email "studio-bot@users.noreply.github.com"
          git add . && git commit -qm "Casting ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ${{ needs.plan.outputs.branche }}
