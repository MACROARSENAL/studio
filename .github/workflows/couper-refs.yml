name: Références de voix sans heure

# Coupe les références « net » et « chaleureux » de Victor (FR, EN, ES) avant l'heure qu'elles contenaient (radio/voix/couper_refs.py).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  couper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Outils
        run: sudo apt-get install -y -qq ffmpeg > /dev/null && python -m venv /tmp/asr && /tmp/asr/bin/pip install -q faster-whisper numpy
      - name: Couper
        run: /tmp/asr/bin/python radio/voix/couper_refs.py
      - name: Ranger
        run: |
          git config user.name "studio-bot"; git config user.email "studio-bot@users.noreply.github.com"
          git add radio/voix && git commit -qm "Radio : références « net » et « chaleureux » coupées avant l'heure (FR, EN, ES)" && git push -q origin HEAD:main
